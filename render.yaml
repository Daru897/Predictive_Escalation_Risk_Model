services:
  - type: web
    name: signaldesk
    runtime: docker
    plan: starter
    rootDir: web
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: signaldesk-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SETUP_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_PATH
        value: /app/data/monitor.sqlite
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "3001"
